server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to FastAPI backend container
    location /query {
        proxy_pass http://backend:8000/query;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    location /query/stream {
        proxy_pass http://backend:8000/query/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
    }

    location /upload {
        proxy_pass http://backend:8000/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 50M;
    }

    location /documents {
        proxy_pass http://backend:8000/documents;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /stats {
        proxy_pass http://backend:8000/stats;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /guardrails {
        proxy_pass http://backend:8000/guardrails;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /graph {
        proxy_pass http://backend:8000/graph;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
